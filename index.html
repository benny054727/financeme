<body>

<!-- ============ LOGIN (Supabase Auth) ============ -->
<div id="login" class="setup hide">
  <div class="slogo"><div class="si">💰</div><h1>FinanceMe</h1><p>התחבר כדי לגשת לנתונים שלך מכל מכשיר — הם מסונכרנים בענן.</p></div>
  <div class="box">
    <div class="fld"><label>אימייל</label><input id="authEmail" type="email" placeholder="you@example.com" autocomplete="email"/></div>
    <div class="fld"><label>סיסמה</label><input id="authPw" type="password" placeholder="לפחות 6 תווים" autocomplete="current-password"/></div>
    <button class="btn" onclick="doSignIn()">התחברות</button>
    <button class="btn sec" style="margin-top:10px" onclick="doSignUp()">משתמש חדש — הרשמה</button>
    <div id="authMsg" class="mini" style="margin-top:12px;text-align:center"></div>
  </div>
</div>

<!-- ============ SETUP ============ -->
<div id="setup" class="setup hide"></div>

<!-- ============ APP ============ -->
<div id="app" class="hide">
<header>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="hinner">
    <div class="brand"><div class="bicon">💰</div><div class="bname">FinanceMe</div></div>
    <div class="hbtns"><div id="syncBadge" title="מסנכרן..." onclick="handleSyncBadgeClick()">⏳</div><button class="hbtn" onclick="openSettings()">⚙️</button></div>
  </div>
  <div class="htitle"><h1 id="ptitle"></h1><p id="psub"></p></div>
</header>
<main id="view"></main>
</div>

<nav id="nav" class="hide">
  <button data-p="home" class="on"><span class="ni">🏠</span>בית</button>
  <button data-p="account"><span class="ni">🏦</span>עו"ש</button>
  <button class="spacer"><span class="ni">•</span>-</button>
  <button data-p="cards"><span class="ni">💳</span>אשראי</button>
  <button data-p="expenses"><span class="ni">📋</span>הוצאות</button>
  <button data-p="savings"><span class="ni">🎯</span>חיסכון</button>
</nav>
<button id="fab" class="fab hide" onclick="openEntry()">+</button>

<!-- Supabase JS SDK — חייב להיטען לפני app.js -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
